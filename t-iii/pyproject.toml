[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ripl-pusht-llm-reward-generation"
version = "0.1.0"
description = "Auditable video-to-reward and episode-sampler generation for Push-T"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.4,<3",
]

[project.optional-dependencies]
llm = ["openai>=1.50,<3"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["ripl_t3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
