[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ripl-pusht-failure-analysis"
version = "0.1.0"
description = "Failure identification and targeted evaluation for the RIPL Push-T assignment"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "torch>=2.4,<3",
  "tqdm>=4.66,<5",
  "tyro>=0.8,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["ripl_t2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../t-i"]

[tool.ruff]
line-length = 100
target-version = "py310"
